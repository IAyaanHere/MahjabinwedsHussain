<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b29250"/>
      <stop offset="25%" stop-color="#e8d5a7"/>
      <stop offset="50%" stop-color="#fdf4df"/>
      <stop offset="75%" stop-color="#cfb16e"/>
      <stop offset="100%" stop-color="#8c6d2d"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c6d2d"/>
      <stop offset="35%" stop-color="#f5e7c8"/>
      <stop offset="70%" stop-color="#b29250"/>
      <stop offset="100%" stop-color="#d8bc7a"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#553a11" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Fine Ring -->
  <circle cx="300" cy="300" r="260" fill="none" stroke="url(#goldRing)" stroke-width="1.5" opacity="0.6"/>
  <!-- Dotted Accent Ring -->
  <circle cx="300" cy="300" r="248" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="3 7" opacity="0.75"/>
  <!-- Inner Fine Ring -->
  <circle cx="300" cy="300" r="236" fill="none" stroke="url(#goldRing)" stroke-width="1.5" opacity="0.6"/>

  <!-- Compass Cardinal Ornaments -->
  <g transform="translate(300, 48) scale(0.9)" fill="url(#goldGrad)">
    <path d="M0 -14 L4 -2 L16 0 L4 2 L0 14 L-4 2 L-16 0 L-4 -2 Z"/>
    <circle cx="0" cy="0" r="2.5" fill="#fdf4df"/>
  </g>
  <g transform="translate(300, 552) scale(0.9)" fill="url(#goldGrad)">
    <path d="M0 -14 L4 -2 L16 0 L4 2 L0 14 L-4 2 L-16 0 L-4 -2 Z"/>
    <circle cx="0" cy="0" r="2.5" fill="#fdf4df"/>
  </g>
  <g transform="translate(48, 300) scale(0.9)" fill="url(#goldGrad)">
    <path d="M0 -14 L4 -2 L16 0 L4 2 L0 14 L-4 2 L-16 0 L-4 -2 Z"/>
    <circle cx="0" cy="0" r="2.5" fill="#fdf4df"/>
  </g>
  <g transform="translate(552, 300) scale(0.9)" fill="url(#goldGrad)">
    <path d="M0 -14 L4 -2 L16 0 L4 2 L0 14 L-4 2 L-16 0 L-4 -2 Z"/>
    <circle cx="0" cy="0" r="2.5" fill="#fdf4df"/>
  </g>

  <!-- Corner Flourishes / Arabesque Leaf Buds -->
  <g stroke="url(#goldGrad)" stroke-width="1.8" fill="none" opacity="0.8">
    <path d="M 440 160 C 475 195 490 230 495 245 C 480 240 450 230 435 200"/>
    <circle cx="440" cy="160" r="3" fill="url(#goldGrad)"/>
    <path d="M 160 160 C 125 195 110 230 105 245 C 120 240 150 230 165 200"/>
    <circle cx="160" cy="160" r="3" fill="url(#goldGrad)"/>
    <path d="M 440 440 C 475 405 490 370 495 355 C 480 360 450 370 435 400"/>
    <circle cx="440" cy="440" r="3" fill="url(#goldGrad)"/>
    <path d="M 160 440 C 125 405 110 370 105 355 C 120 360 150 370 165 400"/>
    <circle cx="160" cy="440" r="3" fill="url(#goldGrad)"/>
  </g>

  <!-- Crest Crown Ornament at Top -->
  <g transform="translate(300, 115) scale(0.75)" fill="url(#goldGrad)" filter="url(#goldGlow)">
    <path d="M -30 25 Q 0 -5 30 25 Q 20 10 0 16 Q -20 10 -30 25 Z"/>
    <circle cx="0" cy="0" r="5"/>
    <circle cx="-25" cy="12" r="3.5"/>
    <circle cx="25" cy="12" r="3.5"/>
  </g>

  <!-- Letters: M & H -->
  <text x="215" y="340"
        font-family="'Bodoni Moda', 'Cormorant SC', 'Playfair Display', Didot, 'Times New Roman', serif"
        font-size="160"
        font-weight="400"
        text-anchor="middle"
        fill="url(#goldGrad)"
        filter="url(#goldGlow)"
        letter-spacing="0">M</text>

  <text x="300" y="325"
        font-family="'Parisienne', 'Monsieur La Doulaise', cursive, serif"
        font-size="95"
        font-style="italic"
        text-anchor="middle"
        fill="url(#goldRing)"
        filter="url(#goldGlow)"
        opacity="0.95">&amp;</text>

  <text x="385" y="340"
        font-family="'Bodoni Moda', 'Cormorant SC', 'Playfair Display', Didot, 'Times New Roman', serif"
        font-size="160"
        font-weight="400"
        text-anchor="middle"
        fill="url(#goldGrad)"
        filter="url(#goldGlow)"
        letter-spacing="0">H</text>

  <!-- Under-Monogram Floral Swag / Flourish -->
  <g transform="translate(300, 420) scale(0.85)" fill="url(#goldGrad)" filter="url(#goldGlow)">
    <path d="M 0 0 C -35 0 -70 -12 -95 -28 C -75 -20 -40 -12 0 -12 C 40 -12 75 -20 95 -28 C 70 -12 35 0 0 0 Z"/>
    <circle cx="0" cy="-6" r="4.5" fill="#fdf4df"/>
    <circle cx="-45" cy="-14" r="2.5"/>
    <circle cx="45" cy="-14" r="2.5"/>
  </g>
</svg>